AWSTemplateFormatVersion: '2010-09-09'
Description: Private-access EC2 lab host for local-only Grafana and Prometheus; no inbound ports.
Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Choose a subnet with outbound internet access for package installation.
  VpcId:
    Type: AWS::EC2::VPC::Id
Resources:
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; SSM outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
  LabRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  LabProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref LabRole]
  LabInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref LabSecurityGroup]
      IamInstanceProfile: !Ref LabProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
      Tags:
        - Key: Name
          Value: Network-Monitoring-Private-Lab
Outputs:
  InstanceId:
    Value: !Ref LabInstance
    Description: Use AWS Systems Manager Session Manager; SSH is not exposed.
